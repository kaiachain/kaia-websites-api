name: kaia-websites-api build image workflow for PROD env
on:
  push:
    branches: ["main"]

env:
  PROJECT_ID: "kaia-cluster-prod"
  SERVICE_ACCOUNT: "kaia-websites-api-prod@kaia-cluster-prod.iam.gserviceaccount.com"
  WORKLOAD_IDENTITY_PROVIDER: "projects/380808041996/locations/global/workloadIdentityPools/kaia-cluster-prod/providers/kaia-websites-api-gha-prvdr"
  AR_REPO_LOCATION: "asia-northeast3"
  AR_URL: "asia-northeast3-docker.pkg.dev/kaia-cluster-prod/kaia-websites-api"

jobs:
  push_to_ar:
    permissions:
      contents: 'read'
      id-token: 'write'
    environment:
      name: ${{ github.ref_name }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          project_id: ${{ env.PROJECT_ID }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v1'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.AR_REPO_LOCATION }}-docker.pkg.dev'

      - name: Build Container
        id: build
        run: |
          IMAGE_URL="${{ env.AR_URL }}/kaia-websites-api"
          IMAGE_TAG=$(git rev-parse --short HEAD)

          docker build -t $IMAGE_URL:$IMAGE_TAG .
          docker tag $IMAGE_URL:$IMAGE_TAG $IMAGE_URL:latest
          echo "image=$IMAGE_URL:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Gate: the image is not pushed if it has a fixable CRITICAL finding.
      # HIGH findings are listed in the log; pull requests are gated on them
      # by the security-scan workflow.
      - name: Trivy scan (report HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ steps.build.outputs.image }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"

      - name: Trivy scan (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ steps.build.outputs.image }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
          skip-setup-trivy: true

      - name: Push Container to ${{ env.PROJECT_ID }}
        run: |
          IMAGE_URL="${{ env.AR_URL }}/kaia-websites-api"

          echo "Pushing all tags to ${IMAGE_URL}"
          docker push --all-tags "${IMAGE_URL}"
